services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: plantao
      POSTGRES_USER: plantao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantao_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - plantao-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantao -d plantao"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/plantao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantao_dev}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  plantao-dados:
