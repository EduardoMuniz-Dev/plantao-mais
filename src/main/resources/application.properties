spring.application.name=plantao-mais
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:5432/plantao
spring.datasource.username=plantao
spring.datasource.password=${POSTGRES_PASSWORD:plantao_dev}
spring.jpa.hibernate.ddl-auto=update
server.address=127.0.0.1

# Validação de tokens JWT emitidos pelo Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/plantao}
